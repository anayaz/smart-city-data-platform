services:
  postgres:
    image: postgres:17
    container_name: urban_postgres

    environment:
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: urban_analytics

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban_user -d urban_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: urban_api

    ports:
      - "8001:8000"

    environment:
      DB_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: